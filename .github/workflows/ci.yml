name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Il GITHUB_TOKEN dei job serve solo a leggere il repository: il deploy usa chiavi SSH a parte.
permissions:
  contents: read

jobs:
  # ── Backend ──────────────────────────────────────────
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Come in produzione (Node 24 su Plesk): il lockfile è di npm 11, che
          # npm 10 (Node 20) considera fuori sync e `npm ci` fallisce.
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Critiche: bloccano la CI. High: avviso nel riepilogo della run, senza bloccare
      # (alcune non hanno ancora una correzione upstream); le PR di fix le apre Dependabot.
      - name: Security audit (critical = blocking)
        run: npm audit --omit=dev --audit-level=critical

      - name: Security audit (high = warning)
        run: |
          if ! npm audit --omit=dev --audit-level=high > audit-high.txt 2>&1; then
            echo "::warning title=npm audit backend::Vulnerabilità high nelle dipendenze di produzione (vedi il log di questo passo)"
            cat audit-high.txt
          fi

      - name: Lint
        run: npm run lint || true   # non-blocking until lint baseline is clean

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Test
        run: npm test -- --passWithNoTests --forceExit
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-at-least-32-chars-long

      # pdf-parse fa un import() dinamico che Jest supporta solo con
      # --experimental-vm-modules, flag che però rompe altre suite: i test che
      # leggono PDF veri girano a parte (npm test li esclude).
      - name: Test PDF (experimental-vm-modules)
        run: npm run test:pdf -- --forceExit
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-at-least-32-chars-long
          MONGODB_URI: mongodb://localhost:27017/portfolio_test

  # ── Frontend ──────────────────────────────────────────
  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit (critical = blocking)
        run: npm audit --omit=dev --audit-level=critical

      - name: Security audit (high = warning)
        run: |
          if ! npm audit --omit=dev --audit-level=high > audit-high.txt 2>&1; then
            echo "::warning title=npm audit frontend::Vulnerabilità high nelle dipendenze di produzione (vedi il log di questo passo)"
            cat audit-high.txt
          fi

      # Non bloccante come nel backend: angular-eslint non è installato, quindi
      # `ng lint` non ha un target e falliva sempre, fermando test e build
      - name: Lint
        run: npm run lint || true

      - name: Unit tests
        run: npm test

      # Lo script che calcola gli hash della CSP gira dopo ogni build: se si rompe, il sito
      # resterebbe con 'unsafe-inline' (fail-safe) senza che nessuno se ne accorga.
      - name: CSP hashes script tests
        run: node --test ../scripts/csp-hashes.test.js

      # BUILD_COMMIT: se il prebuild rigenera la sitemap il working tree risulta
      # modificato e il commit mostrato nel sito avrebbe il suffisso "+"
      - name: Build (production)
        run: BUILD_COMMIT="$(git rev-parse --short HEAD)" npm run build:prod

      # Il deploy su Plesk (push su main) carica proprio questa build
      - name: Upload build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist
          path: frontend/dist/portfolio-frontend/browser/
          include-hidden-files: true   # .htaccess: proxy verso il backend
          retention-days: 3
          if-no-files-found: error

  # ── Frontend E2E ────────────────────────────────────
  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ── Docker build smoke test ───────────────────────────
  # Solo l'immagine del backend (variante Docker di docker-compose.plesk.yml).
  # Quella del frontend non si costruisce: con contesto ./frontend il prebuild
  # non trova ../scripts, e in produzione il frontend è statico su Apache (lo
  # compila e lo rilascia già il job Frontend → deploy-frontend).
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build backend image (cache check)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: backend:ci

  # ── Deploy backend su Plesk ──────────────────────────
  # Push su develop → se i test del backend passano e sono cambiati file del
  # backend o degli script di rilascio, compila il bundle qui (Ubuntu 24.04,
  # stessa glibc del server) e lo attiva sul server con pm2. Il server non
  # compila nulla: 1.8 GB di RAM non bastano per `nest build`.
  # Si attiva solo quando la variabile di repository PLESK_SSH è impostata
  # (Settings → Secrets and variables → Actions), vedi docs/guides/deploy-plesk.md.
  deploy-backend:
    name: Deploy backend (Plesk)
    runs-on: ubuntu-24.04
    needs: [backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.PLESK_SSH != ''
    # Mai due rilasci in parallelo: il secondo aspetta il primo
    concurrency:
      group: deploy-backend-plesk
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Changed backend files?
        id: changes
        run: |
          BEFORE="${{ github.event.before }}"
          # Primo push / force push: il commit precedente non esiste → rilascia
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BEFORE" "$GITHUB_SHA" -- backend scripts/plesk scripts/build-backend-bundle.sh scripts/release-backend-plesk.sh | grep -q .; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nessuna modifica al backend: salto il rilascio."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.changes.outputs.deploy == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Build bundle
        if: steps.changes.outputs.deploy == 'true'
        run: ./scripts/build-backend-bundle.sh "$RUNNER_TEMP/backend-bundle.tgz"

      - name: SSH key
        if: steps.changes.outputs.deploy == 'true'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.PLESK_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.PLESK_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Release
        if: steps.changes.outputs.deploy == 'true'
        env:
          PLESK_SSH: ${{ vars.PLESK_SSH }}
          BUNDLE: ${{ runner.temp }}/backend-bundle.tgz
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: ./scripts/release-backend-plesk.sh

  # ── Deploy frontend su Plesk ─────────────────────────
  # Push su main → se unit test, build ed e2e del frontend passano, carica in
  # ~/httpdocs la build del job Frontend con rsync (al posto dell'upload
  # FileZilla) e controlla che il sito serva la versione nuova.
  # Usa gli stessi secret e la stessa variabile PLESK_SSH del deploy del backend.
  deploy-frontend:
    name: Deploy frontend (Plesk)
    runs-on: ubuntu-24.04
    needs: [frontend, frontend-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PLESK_SSH != ''
    # Mai due rilasci in parallelo: il secondo aspetta il primo
    concurrency:
      group: deploy-frontend-plesk
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-dist
          path: ${{ runner.temp }}/frontend-dist

      - name: SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.PLESK_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.PLESK_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Release
        env:
          PLESK_SSH: ${{ vars.PLESK_SSH }}
        run: ./scripts/release-frontend-plesk.sh "$RUNNER_TEMP/frontend-dist"
