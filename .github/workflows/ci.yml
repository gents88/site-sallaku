name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Backend ──────────────────────────────────────────
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit (visibility only — Dependabot opens the fix PRs)
        run: npm audit --omit=dev --audit-level=high || true

      - name: Lint
        run: npm run lint || true   # non-blocking until lint baseline is clean

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Test
        run: npm test -- --passWithNoTests --forceExit
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-at-least-32-chars-long
          MONGODB_URI: mongodb://localhost:27017/portfolio_test

  # ── Frontend ──────────────────────────────────────────
  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit (visibility only — Dependabot opens the fix PRs)
        run: npm audit --omit=dev --audit-level=high || true

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build (production)
        run: npm run build:prod

  # ── Frontend E2E ────────────────────────────────────
  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ── Docker build smoke test ───────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend, frontend-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (cache check)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: backend:ci

      - name: Build frontend image (cache check)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: frontend:ci

  # ── Deploy backend su Plesk ──────────────────────────
  # Push su develop → se i test del backend passano e sono cambiati file del
  # backend o degli script di rilascio, compila il bundle qui (Ubuntu 24.04,
  # stessa glibc del server) e lo attiva sul server con pm2. Il server non
  # compila nulla: 1.8 GB di RAM non bastano per `nest build`.
  # Si attiva solo quando la variabile di repository PLESK_SSH è impostata
  # (Settings → Secrets and variables → Actions), vedi docs/guides/deploy-plesk.md.
  deploy-backend:
    name: Deploy backend (Plesk)
    runs-on: ubuntu-24.04
    needs: [backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.PLESK_SSH != ''
    # Mai due rilasci in parallelo: il secondo aspetta il primo
    concurrency:
      group: deploy-backend-plesk
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Changed backend files?
        id: changes
        run: |
          BEFORE="${{ github.event.before }}"
          # Primo push / force push: il commit precedente non esiste → rilascia
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BEFORE" "$GITHUB_SHA" -- backend scripts/plesk scripts/build-backend-bundle.sh scripts/release-backend-plesk.sh | grep -q .; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nessuna modifica al backend: salto il rilascio."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.changes.outputs.deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Build bundle
        if: steps.changes.outputs.deploy == 'true'
        run: ./scripts/build-backend-bundle.sh "$RUNNER_TEMP/backend-bundle.tgz"

      - name: SSH key
        if: steps.changes.outputs.deploy == 'true'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.PLESK_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.PLESK_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Release
        if: steps.changes.outputs.deploy == 'true'
        env:
          PLESK_SSH: ${{ vars.PLESK_SSH }}
          BUNDLE: ${{ runner.temp }}/backend-bundle.tgz
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: ./scripts/release-backend-plesk.sh
