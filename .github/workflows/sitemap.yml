name: Generate sitemap & RSS feed

on:
  push:
    branches: ["develop", "main"]
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC

# Il job fa commit e push della sitemap/RSS rigenerati: senza permesso di
# scrittura il token di default è in sola lettura e il push fallisce (403).
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 18

      - name: Run sitemap generator
        run: |
          node scripts/generate-sitemap.js

      - name: Run RSS feed generator
        run: |
          node scripts/generate-rss.js

      - name: Commit sitemap/RSS if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/sitemap.xml frontend/public/sitemap.xml public/rss.xml frontend/public/rss.xml || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate sitemap and RSS feed [skip ci]" || true
            git push
          else
            echo "No changes to commit"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
