@if (drawerOpen()) {
  <div class="sidebar-overlay" (click)="closeDrawer()" aria-hidden="true"></div>
}

<aside
  id="app-sidebar"
  class="app-sidebar"
  [class.open]="drawerOpen()"
  role="navigation"
  aria-label="Main navigation"
>
  <div class="sidebar-header">
    <span class="sidebar-brand">{{ isAdminUser() ? '⚙️ Admin' : '🧰 AI & Tools' }}</span>
    <button class="close-btn" type="button" aria-label="Close menu" (click)="closeDrawer()">✕</button>
  </div>

  <nav class="sidebar-nav">
    @for (group of navGroups(); track group.id) {
      <div class="nav-group">
        <div class="nav-group-label">{{ group.emoji }} {{ group.title }}</div>
        @for (item of group.items; track item.route) {
          <a
            [routerLink]="item.route"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
            class="nav-item"
            (click)="closeDrawer()"
          >
            <span class="nav-icon" aria-hidden="true">{{ item.icon }}</span>
            <span>{{ item.label }}</span>
          </a>
        }
      </div>
    }
  </nav>
</aside>

<button
  class="sidebar-fab"
  type="button"
  [attr.aria-expanded]="drawerOpen()"
  aria-controls="app-sidebar"
  aria-label="Open navigation menu"
  (click)="toggleDrawer()"
>
  <span></span><span></span><span></span>
</button>
