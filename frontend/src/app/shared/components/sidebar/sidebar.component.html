<div class="sidebar-backdrop" [class.open]="drawerOpen()" (click)="closeDrawer()" aria-hidden="true"></div>

<aside
  id="app-sidebar"
  class="app-sidebar"
  [class.open]="drawerOpen()"
  role="navigation"
  aria-label="Main navigation"
>
  <div class="sidebar-header">
    <div class="sidebar-brand">
      <span class="brand-badge" aria-hidden="true">{{ isAdminUser() ? '⚙️' : '🧰' }}</span>
      <span class="brand-label">{{ isAdminUser() ? 'Admin' : 'AI & Tools' }}</span>
    </div>
    <button class="close-btn" type="button" aria-label="Close menu" (click)="closeDrawer()">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </button>
  </div>

  <nav class="sidebar-nav">
    @for (group of navGroups(); track group.id) {
      <div class="nav-group">
        <div class="nav-group-label">
          <span aria-hidden="true">{{ group.emoji }}</span>
          <span>{{ group.title }}</span>
        </div>
        @for (item of group.items; track item.route) {
          <a
            [routerLink]="item.route"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
            class="nav-item"
            (click)="closeDrawer()"
          >
            <span class="nav-icon" aria-hidden="true">{{ item.icon }}</span>
            <span class="nav-label">{{ item.label }}</span>
          </a>
        }
      </div>
    }
  </nav>
</aside>
