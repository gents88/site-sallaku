    <!-- Hreflang tags: injected dynamically by SeoService.updateHreflang() on every
         route (server + browser), covering all 7 site languages — not hardcoded here
         to avoid duplicate/stale tags. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Open Graph image: dedicated 1200x630 social card (rendered from og-image.svg) -->
    <meta property="og:image" content="https://gentsallaku.it/assets/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Gent Sallaku - Senior Front-End &amp; API Developer" />

    <meta name="twitter:creator" content="@gentsallaku" />
    <meta name="twitter:image" content="https://gentsallaku.it/assets/og-image.png" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Font Awesome's CSS + woff2 files are served from jsdelivr, not the
         Google Fonts origins above. Its @font-face below uses
         font-display: optional, which gives the font only a ~100ms window
         to arrive before permanently falling back for that page view — with
         no preconnect here, the DNS/TLS handshake to jsdelivr only starts
         once the browser parses the <link> below, which routinely blows
         that window and left icons (e.g. the article share row) missing. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- Google Fonts — async, non-render-blocking -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" /></noscript>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/icon?family=Material+Icons&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons&display=swap" /></noscript>
    <!-- mat-icon renders ligature text ("work", "history_edu", ...) until this
         font loads, so `display=swap` above means real words flash inside icon
         chips app-wide (dashboard stat cards, navbar, buttons) before the glyph
         pops in — much more jarring than ordinary text FOUT. Same document-order
         override trick as Font Awesome below, but `block` (not `optional`):
         these icons are functional UI everywhere, not decorative/skippable, so
         they must always render — briefly invisible is fine, permanently
         missing is not. -->
    <style>
      @font-face { font-family: "Material Icons"; font-style: normal; font-weight: 400; font-display: block; src: url("https://fonts.gstatic.com/s/materialicons/v145/flUhRq6tzZclQEJ-Vdg-IuiaDsNc.woff2") format("woff2"); }
    </style>
    <!-- Font Awesome 6 — async, non-render-blocking -->
    <link rel="preload" as="style" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css" /></noscript>
    <!-- Font Awesome ships font-display:block (Lighthouse: ~2.5s combined FCP
         cost on this page). Declared after FA's own <link> so it wins the
         same-family/weight/style @font-face resolution (document order),
         same font files. `optional` (~100ms block, then give up forever for
         that page view) was tried here and made icons across the site
         (notably the article share row) go permanently missing whenever the
         jsdelivr fetch didn't land inside that razor-thin window — which on
         real-world connections, especially cold ones like arriving fresh
         from a Google search result, is often. `fallback` keeps the same
         ~100ms block (no first-paint delay) but adds a bounded ~3s swap
         window, so a font that's merely a bit slow still shows up instead
         of being skipped — while capping the late-swap reflow that made
         `swap` reflow icon-heavy rows (footer, cookie banner) at an
         arbitrary time after first paint, which was this page's original
         CLS source. -->
    <style>
      @font-face { font-family: "Font Awesome 6 Free"; font-style: normal; font-weight: 900; font-display: fallback; src: url("https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/webfonts/fa-solid-900.woff2") format("woff2"); }
      @font-face { font-family: "Font Awesome 6 Free"; font-style: normal; font-weight: 400; font-display: fallback; src: url("https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/webfonts/fa-regular-400.woff2") format("woff2"); }
      @font-face { font-family: "Font Awesome 6 Brands"; font-style: normal; font-weight: 400; font-display: fallback; src: url("https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/webfonts/fa-brands-400.woff2") format("woff2"); }
    </style>
    <!-- Google Analytics 4 (loaded conditionally by SeoService when ID is set) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      // Default Consent Mode v2: denied until user grants consent
      try {
        gtag('consent', 'default', {
          ad_storage: 'denied',
          analytics_storage: 'denied',
          ad_user_data: 'denied',
          ad_personalization: 'denied'
        });
      } catch (e) { /* ignore if gtag not available */ }
    </script>
    <!-- GA4 library itself: loaded statically (present in prerendered HTML, not
         just injected client-side) so tools like Search Console's "verify via
         Google Analytics" can find it. Consent Mode defaults above are already
         set before this loads, so no tracking/cookies fire until the user
         grants consent. Keep this ID in sync with environment.prod.ts's
         googleAnalyticsId. -->
    <script id="ga-script" async src="https://www.googletagmanager.com/gtag/js?id=G-ENE1XXREY6"></script>
    <script>gtag('config', 'G-ENE1XXREY6');</script>
    <!-- Google Tag Manager — disabled. The placeholder ID below was never replaced
         with a real container ID, so every time a user granted analytics/marketing
         consent, consent.service.ts fired a real (failing) request to
         googletagmanager.com/gtm.js?id=GTM-XXXX for zero functional benefit.
         Uncomment and set a real 'GTM-...' ID if/when GTM is actually set up.
    <script>window.__GTM_ID__ = 'GTM-XXXX';</script>
    -->
    <!--
      Google AdSense — disabled. The placeholder client ID below was never
      replaced with a real publisher ID, so this script downloaded ~220KB
      (adsbygoogle.js + show_ads_impl_fy2021.js) on every single page load
      for zero functional benefit (no ID = no ads ever served). Uncomment
      and set a real 'ca-pub-...' ID if/when AdSense is actually set up.
      IMPORTANT: do NOT change 'crossorigin="anonymous"'.
    <script async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX"
      crossorigin="anonymous">
    </script>
    -->
  </head>
