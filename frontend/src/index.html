    <!-- Niente transizioni CSS finché la pagina non è pronta. Molte regole usano
         `transition: var(--transition-base)`, cioè `transition: all`: ogni stile che
         cambia dopo il primo paint (styles.css asincrono, tema chiaro assente dal
         CSS critico, attributi impostati al bootstrap, stato di navbar e sidebar)
         diventava un'animazione, ~300 al caricamento, ricalcolate a ogni frame sul
         main thread. AppComponent toglie la classe dopo l'avvio (core/utils/boot-phase.ts). -->
    <style>
      html.is-booting, html.is-booting *, html.is-booting *::before, html.is-booting *::after { transition: none !important; }
    </style>
    <!-- Stato iniziale della sidebar prima del primo paint. DrawerService scrive
         lo stesso attributo dopo il bootstrap: senza questo, su desktop il
         contenuto partirebbe a piena larghezza e slitterebbe di 76px appena
         Angular idrata. Tenere soglia e chiave allineate a drawer.service.ts. -->
    <!-- Tema prima del primo paint: scelta esplicita salvata (portfolio_theme_choice,
         vedi theme.service.ts) oppure il tema del sistema del dispositivo. Senza,
         le pagine prerenderizzate partivano sempre scure (data-theme="dark") e chi
         usa il tema chiaro vedeva un lampo scuro prima del bootstrap. -->
    <script>
      (function () {
        var theme = 'dark';
        try {
          var choice = localStorage.getItem('portfolio_theme_choice');
          if (choice === 'light' || choice === 'dark') theme = choice;
          else if (window.matchMedia) theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        } catch (e) { /* storage/matchMedia non disponibili: resta scuro */ }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <script>
      (function () {
        try {
          if (!window.matchMedia('(min-width: 1200px)').matches) return;
          var pinned = localStorage.getItem('gs-sidebar-pinned') === '1';
          document.documentElement.setAttribute('data-sidebar', pinned ? 'rail-expanded' : 'rail');
        } catch (e) { /* storage/matchMedia non disponibili: nessun offset iniziale */ }
      })();
    </script>

    <!-- Fonts — all self-hosted, no third-party origins left in the critical
         path. Inter and JetBrains Mono moved here from Google Fonts for the
         same three reasons documented below for the icon fonts, plus one
         specific to Inter: it renders the hero <h1>, which is the LCP
         element on the homepage. A font blocked by an ad blocker or stalled
         on a cold cross-origin connection was a visible reflow on exactly
         the metric that matters most.

         Both are variable fonts: one file each covers the full weight range
         the site uses (Inter 300-900, all seven weights are in use), instead
         of seven and three separate static requests.

         Inter is preloaded because it's LCP-critical: without it the browser
         only discovers the font after parsing the stylesheet. JetBrains Mono
         is not — it's for code blocks, well below the fold. -->
    <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/inter/inter-latin.woff2" crossorigin />
    <!-- @font-face di Inter inline invece che in un foglio caricato in modo
         asincrono (era assets/fonts/inter/inter.css). Così la dichiarazione arrivava
         dopo il primo paint: il testo partiva col font di ripiego e cambiava
         larghezza poco dopo (layout shift), anche se il file del font era già
         scaricato grazie al preload qui sopra. -->
    <style>
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 300 900; font-display: swap; src: url(/assets/fonts/inter/inter-latin-ext.woff2) format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 300 900; font-display: swap; src: url(/assets/fonts/inter/inter-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    </style>
    <!-- I fogli dei font sono bloccanti, come styles.css (inlineCritical: false in
         angular.json). Caricati in modo asincrono arrivavano dopo il primo paint e
         ognuno ricalcolava stile e layout dell'intera pagina, a pagina già visibile:
         misurato con Lighthouse (2026-11-02), il TBT scendeva di circa un terzo
         rendendoli bloccanti, al costo di un FCP poco più tardo. -->
    <link rel="stylesheet" href="/assets/fonts/jetbrains-mono/jetbrains-mono.css" />
    <!-- Material Icons and Font Awesome are self-hosted from /assets/fonts
         instead of Google Fonts / jsdelivr. Three independent bugs traced
         back to those being third-party CDNs: (1) font-display:optional's
         ~100ms window routinely missed on cold cross-origin connections,
         permanently hiding icons for that page view; (2) a hand-copied
         gstatic URL silently went stale when Google rotated the file hash
         under the same version; (3) some visitors' ad/tracker blockers
         reject requests to fonts.googleapis.com / cdn.jsdelivr.net outright,
         which no amount of preconnect/font-display tuning can fix — same
         origin as the page itself isn't a domain a blocklist targets, and
         there's no cross-origin handshake left to race against. Same-origin
         hosting also means a plain `swap` is safe: no third-party latency
         to hide, so the font arrives fast enough that the invisible-text
         window is negligible, without `optional`'s risk of a permanent miss
         or `block`'s multi-second invisible-text stall. -->
    <link rel="stylesheet" href="/assets/fonts/material-icons/material-icons.css" />
    <link rel="stylesheet" href="/assets/fonts/fontawesome/css/all.min.css" />
    <!-- Google Analytics 4 (loaded conditionally by SeoService when ID is set) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      // Default Consent Mode v2: denied until user grants consent
      try {
        gtag('consent', 'default', {
          ad_storage: 'denied',
          analytics_storage: 'denied',
          ad_user_data: 'denied',
          ad_personalization: 'denied'
        });
      } catch (e) { /* ignore if gtag not available */ }
    </script>
    <!-- GA4 library: 187KB of third-party JavaScript, measured as the single
         heaviest request on the homepage — heavier than the entire app bundle,
         and ~680ms of main-thread execution.

         It is no longer loaded here at all. ConsentService pulls it in only
         after the visitor actually grants analytics consent, so every visitor
         who declines or ignores the banner — the majority — never pays for it.
         This was already the effective behaviour: Consent Mode defaults below
         deny storage, so the library was downloading and executing on every
         page load to then do nothing.

         The old comment justified loading it statically so Search Console's
         "verify via Google Analytics" could find it. That reason no longer
         holds: this site is verified with the HTML-file method instead
         (public/googleee6031aefa85f68c.html), so nothing depends on the tag
         being present for a crawler.

         The dataLayer stub, the Consent Mode v2 defaults and the config call
         stay inline and synchronous, so hits queued before consent replay in
         order once the library arrives. Keep the ID in sync with
         environment.prod.ts's googleAnalyticsId. -->
    <script>
      (function () {
        var ID = 'G-ENE1XXREY6';
        gtag('config', ID);

        // Exposed for ConsentService, which calls it once the visitor grants
        // analytics consent. Idempotent — repeated calls are no-ops.
        window.__loadGtag = function () {
          if (document.getElementById('ga-script')) return;
          var s = document.createElement('script');
          s.id = 'ga-script';
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=' + ID;
          document.head.appendChild(s);
        };
      })();
    </script>
    <!-- Google Tag Manager — disabled. The placeholder ID below was never replaced
         with a real container ID, so every time a user granted analytics/marketing
         consent, consent.service.ts fired a real (failing) request to
         googletagmanager.com/gtm.js?id=GTM-XXXX for zero functional benefit.
         Uncomment and set a real 'GTM-...' ID if/when GTM is actually set up.
    <script>window.__GTM_ID__ = 'GTM-XXXX';</script>
    -->
    <!--
      Google AdSense — disabled. The placeholder client ID below was never
      replaced with a real publisher ID, so this script downloaded ~220KB
      (adsbygoogle.js + show_ads_impl_fy2021.js) on every single page load
      for zero functional benefit (no ID = no ads ever served). Uncomment
      and set a real 'ca-pub-...' ID if/when AdSense is actually set up.
      IMPORTANT: do NOT change 'crossorigin="anonymous"'.
    <script async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX"
      crossorigin="anonymous">
    </script>
    -->

  <body class="mat-typography">
    <app-root></app-root>
    <!-- /about, /tech-stack, /experience, /skills e /services sono la home
         prerenderizzata portata a una sezione. Lo si fa qui, appena il parser ci
         arriva: di solito prima del primo paint, comunque secondi prima dell'avvio
         di Angular. Saltandoci dopo l'avvio si vedeva l'hero per ~3 s e poi cambiava
         tutta la schermata (Speed Index, layout forzato, ridisegno a pagina già
         visibile). Durante l'hydration il router non riporta lo scroll in cima.
         I .reveal già in vista diventano visibili subito, altrimenti la sezione
         resterebbe vuota fino all'avvio. Lingue e sezioni: allineate a
         jump-to-section.ts da jump-to-section.spec.ts. -->
    <script>
      (function () {
        var m = /^\/(?:(?:en|sq|es|pt|fr|de)\/)?(about|tech-stack|experience|skills|services)\/?$/.exec(location.pathname);
        var section = m && document.getElementById(m[1]);
        if (!section) return;
        section.scrollIntoView({ behavior: 'instant', block: 'start' });
        var inView = [].filter.call(document.querySelectorAll('.reveal'), function (el) {
          var r = el.getBoundingClientRect();
          return r.top < innerHeight && r.bottom > 0;
        });
        inView.forEach(function (el) { el.classList.add('visible'); });
        document.documentElement.setAttribute('data-pre-scrolled', m[1]);
      })();
    </script>
  </body>
