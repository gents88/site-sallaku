# ─────────────────────────────────────────────────────────────
#  Direttive nginx per gentsallaku.it (backend Docker su Plesk)
#
#  Dove incollarle:
#    Plesk → Siti web e domini → gentsallaku.it → Apache & nginx Settings
#    → "Additional nginx directives"
#
#  Il frontend resta statico in httpdocs/ (FileZilla) e continua a essere
#  servito da Plesk come oggi: qui si aggiungono SOLO i due percorsi che
#  devono arrivare al backend NestJS in ascolto su 127.0.0.1:3000.
# ─────────────────────────────────────────────────────────────

# API REST
location /api/ {
    proxy_pass         http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    # Upload PDF/immagini dei tool /lab
    client_max_body_size 50m;
}

# WebSocket della chat live (socket.io, namespace /live-chat).
# Con apiUrl relativo il client si connette a wss://gentsallaku.it/socket.io/:
# senza questo blocco la chat live non funziona.
location /socket.io/ {
    proxy_pass         http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
}
